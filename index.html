

<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>防災ノート</title>

  <style>

    body {

      margin: 0;

      background: #f6f8f7;

      color: #26332d;

      font-family: sans-serif;

    }

    header {

      background: #438b72;

      color: white;

      padding: 28px 20px;

      text-align: center;

    }

    h1 { margin: 0; }

    main { padding: 20px; }

    .card {

      background: white;

      padding: 20px;

      margin-bottom: 15px;

      border-radius: 16px;

      box-shadow: 0 2px 8px #00000010;

    }

    button {

      background: #438b72;

      color: white;

      border: 0;

      border-radius: 10px;

      padding: 12px 18px;

      font-size: 16px;

    }

  </style>

</head>

<body>

  <header>

    <h1>🐙 防災ノート</h1>

    <p>片付けから始める、わが家の防災</p>

  </header>

  <main>

    <div class="card">

      <h2>🏠 お部屋の防災</h2>

      <p>片付けながら安全な家にしましょう。</p>

      <button onclick="alert('準備中です')">はじめる</button>

    </div>

    <div class="card">

      <h2>🎒 防災リュック</h2>

      <p>本当に必要なものを確認しましょう。</p>

      <button onclick="alert('準備中です')">チェックする</button>

    </div>

    <div class="card">

      <h2>📦 備蓄品管理</h2>

      <p>食料や日用品の備蓄を管理しましょう。</p>

      <button onclick="alert('準備中です')">確認する</button>

    </div>

  </main>

</body>

</html>
